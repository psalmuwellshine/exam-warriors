<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Login - Exam Warriors</title>
  <link rel="icon" href="/logo.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;900&display=swap">
  <link rel="stylesheet" href="/style.css">
  
  <style>
    .auth-container { max-width: 400px !important; margin: 40px auto !important; padding: 30px !important; background: rgba(255, 255, 255, 0.05) !important; border-radius: 8px !important; border: 1px solid rgba(255,255,255,0.1) !important; }
    .auth-container h2 { text-align: center !important; margin-bottom: 25px !important; color: #fff !important; }
    .form-group { margin-bottom: 20px !important; display: flex !important; flex-direction: column !important; }
    .form-group label { display: block !important; margin-bottom: 8px !important; font-weight: bold !important; color: #f5c211 !important; font-size: 0.9em !important; }
    .form-group input { width: 100% !important; padding: 12px !important; border-radius: 4px !important; border: 1px solid #555 !important; background: #222 !important; color: #fff !important; font-family: inherit !important; font-size: 1em !important; box-sizing: border-box !important; }
    .form-group input:focus { outline: none !important; border-color: #f5c211 !important; }
    .auth-btn { width: 100% !important; padding: 12px !important; background: #f5c211 !important; color: #000 !important; font-weight: bold !important; font-size: 1em !important; border: none !important; border-radius: 4px !important; cursor: pointer !important; margin-top: 10px !important; }
    .toggle-text { text-align: center !important; margin-top: 20px !important; color: #ccc !important; }
    .toggle-btn { background: transparent !important; border: 1px solid #f5c211 !important; color: #f5c211 !important; padding: 8px 20px !important; cursor: pointer !important; border-radius: 4px !important; margin-top: 10px; }
    .error-msg { color: #ff4d4d !important; text-align: center !important; margin-bottom: 15px !important; display: none; background: rgba(255, 77, 77, 0.1) !important; padding: 10px !important; border-radius: 4px !important; }
    .success-msg { color: #4dff4d !important; text-align: center !important; margin-bottom: 15px !important; display: none; background: rgba(77, 255, 77, 0.1) !important; padding: 10px !important; border-radius: 4px !important; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header class="band gut">
    <div class="in head">
      <div class="brand">
        <img class="logo" src="/logo.png" alt="Exam Warriors logo">
        <div><span class="wm">Exam Warriors</span></div>
      </div>
      <nav><a href="/">Back to Site</a></nav>
    </div>
  </header>

  <main class="gut">
    <div class="auth-container">
      
      <div id="error-box" class="error-msg"></div>
      <div id="success-box" class="success-msg"></div>

      <!-- LOGIN FORM -->
      <div id="login-section" style="display: block;">
        <h2>Login</h2>
        <form id="form-login">
          <div class="form-group">
            <label>Username</label>
            <input type="text" id="login-user" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-pass" required>
          </div>
          <button type="submit" class="auth-btn">Log In</button>
        </form>
        <div class="toggle-text">
          <p>Don't have an account?</p>
          <button type="button" id="show-register" class="toggle-btn">Register here</button>
        </div>
      </div>

      <!-- REGISTER FORM -->
      <div id="register-section" style="display: none;">
        <h2>Create an Account</h2>
        <form id="form-register">
          <div class="form-group">
            <label>Username</label>
            <input type="text" id="reg-user" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="reg-pass" required>
          </div>
          <button type="submit" class="auth-btn">Register</button>
        </form>
        <div class="toggle-text">
          <p>Already have an account?</p>
          <button type="button" id="show-login" class="toggle-btn">Login here</button>
        </div>
      </div>

    </div>
  </main>

  <script>
    const loginSection = document.getElementById('login-section');
    const registerSection = document.getElementById('register-section');
    const errorBox = document.getElementById('error-box');
    const successBox = document.getElementById('success-box');

    // Switch to Register mode
    document.getElementById('show-register').addEventListener('click', (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      successBox.style.display = 'none';
      loginSection.style.display = 'none';      // Hides login
      registerSection.style.display = 'block';  // Shows register
    });

    // Switch to Login mode
    document.getElementById('show-login').addEventListener('click', (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      successBox.style.display = 'none';
      registerSection.style.display = 'none';   // Hides register
      loginSection.style.display = 'block';     // Shows login
    });

    // Handle Login Submission
    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('login-user').value;
      const password = document.getElementById('login-pass').value;
      await submitAuth('/api/login', username, password);
    });

    // Handle Register Submission
    document.getElementById('form-register').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('reg-user').value;
      const password = document.getElementById('reg-pass').value;
      await submitAuth('/api/register', username, password);
    });

    // The actual connection to the backend
    async function submitAuth(endpoint, username, password) {
      errorBox.style.display = 'none';
      successBox.style.display = 'none';

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok) throw new Error(data.error || 'Something went wrong');

        successBox.textContent = data.message;
        successBox.style.display = 'block';
        
        if (endpoint === '/api/login') {
          localStorage.setItem('examWarriorUser', JSON.stringify(data.user));
          setTimeout(() => { window.location.href = '/'; }, 1500); 
        } else {
          // If registered successfully, switch to login tab
          setTimeout(() => { document.getElementById('show-login').click(); }, 1500);
        }

      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      }
    }
  </script>
</body>
</html>
