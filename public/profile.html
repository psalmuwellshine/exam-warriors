<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Profile - Exam Warriors</title>
  <link rel="icon" href="/logo.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;900&display=swap">
  <link rel="stylesheet" href="/style.css">
  
  <style>
    .profile-container { max-width: 600px !important; margin: 40px auto !important; padding: 30px !important; background: rgba(255, 255, 255, 0.05) !important; border-radius: 8px !important; border: 1px solid rgba(255,255,255,0.1) !important; }
    .profile-container h2 { text-align: center !important; margin-bottom: 25px !important; color: #fff !important; }
    .score-card { background: rgba(0,0,0,0.3); padding: 15px; margin-bottom: 10px; border-radius: 6px; border-left: 4px solid #f5c211; display: flex; justify-content: space-between; align-items: center; }
    .score-title { font-weight: bold; color: #fff; }
    .score-points { color: #f5c211; font-size: 1.2em; font-weight: bold; }
  </style>
</head>
<body>
  <header class="band gut">
    <div class="in head">
      <div class="brand">
        <img class="logo" src="/logo.png" alt="Exam Warriors logo">
        <div><span class="wm">Exam Warriors</span></div>
      </div>
      <nav><a href="/" style="color: #f5c211; font-weight: bold; text-decoration: none;">Back to Home</a></nav>
    </div>
  </header>

  <main class="gut">
    <div class="profile-container">
      <h2 id="welcome-text">Loading Profile...</h2>
      
      <div id="scores-list">
        <!-- Scores will be injected here -->
      </div>
    </div>

    <!-- NEW: Account Settings Form -->
<div style="margin-top: 40px; border-top: 1px solid #333; padding-top: 20px;">
  <h3 style="color: #fff; margin-bottom: 15px;">Account Settings</h3>
  
  <div id="update-msg" style="display: none; padding: 10px; margin-bottom: 15px; border-radius: 4px; text-align: center;"></div>

  <form id="update-form">
    <div class="form-group" style="margin-bottom: 15px; display: flex; flex-direction: column;">
      <label style="color: #f5c211; margin-bottom: 5px; font-weight: bold;">New Username (optional)</label>
      <input type="text" id="new-username" style="padding: 10px; border-radius: 4px; border: 1px solid #555; background: #222; color: #fff;" placeholder="Leave blank to keep current">
    </div>
    
    <div class="form-group" style="margin-bottom: 15px; display: flex; flex-direction: column;">
      <label style="color: #f5c211; margin-bottom: 5px; font-weight: bold;">New Password (optional)</label>
      <input type="password" id="new-password" style="padding: 10px; border-radius: 4px; border: 1px solid #555; background: #222; color: #fff;" placeholder="Leave blank to keep current">
    </div>
    
    <button type="submit" class="auth-btn" id="update-btn" style="background: #f5c211; color: #000; padding: 10px 20px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Update Profile</button>
  </form>
</div>
  </main>

  <!-- We load app.js first so we can use its functions, then run our script -->
  <script src="/app.js"></script>
  
</body>
</html>
