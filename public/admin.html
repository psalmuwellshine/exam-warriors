<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Exam Warriors Admin</title>
<meta name="theme-color" content="#7A1414">
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Albert+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="band gut">
  <div class="in head">
    <div class="brand">
      <img class="logo" src="/logo.png" alt="Exam Warriors logo">
      <div>
        <span class="wm">Admin</span>
        <span class="tagline">Exam Warriors control room</span>
      </div>
    </div>
  </div>
</header>

<main class="gut">
  <div class="in" id="app"></div>
   <!-- NEW: Registered Students Section -->
   <section style="margin-top: 40px; border-top: 1px solid #333; padding-top: 20px;">
      <h3>Registered Students</h3>
      <p class="sub">View all users who have created an account and their best scores.</p>
      
      <button id="load-students-btn" class="btn" style="margin-bottom: 20px;">Load Students</button>
      
      <div id="students-table-container" style="display:none; overflow-x: auto;">
        <table style="width: 100%; text-align: left; border-collapse: collapse; color: #fff;">
          <thead>
            <tr style="border-bottom: 1px solid #f5c211;">
              <th style="padding: 10px;">Username</th>
              <th style="padding: 10px;">Quizzes Taken</th>
              <th style="padding: 10px;">Total Points</th>
            </tr>
          </thead>
          <tbody id="students-table-body">
            <!-- Rows will be injected here by JavaScript -->
          </tbody>
        </table>
      </div>
    </section>
</main>

<footer class="gut"><div class="in"><a href="/" style="color:inherit">Back to the student site</a></div></footer>

<script src="/admin.js"></script>
</body>
</html>
