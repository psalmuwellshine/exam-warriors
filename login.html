<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Login - Exam Warriors</title>
  <meta name="theme-color" content="#7A1414">
  <link rel="icon" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;900&display=swap">
  <link rel="stylesheet" href="/style.css">
  
  <!-- A little custom styling just for the login form to look nice -->
  <style>
    .auth-container { max-width: 400px; margin: 40px auto; padding: 20px; background: rgba(255, 255, 255, 0.05); border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
    .auth-container h2 { text-align: center; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .form-group input { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ccc; background: #fff; color: #000; }
    .auth-btn { width: 100%; padding: 10px; background: #f5c211; color: #000; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
    .auth-btn:hover { background: #e0b000; }
    .toggle-text { text-align: center; margin-top: 15px; font-size: 0.9em; }
    .toggle-text a { color: #f5c211; cursor: pointer; text-decoration: underline; }
    .error-msg { color: #ff4d4d; text-align: center; margin-bottom: 10px; display: none; }
    .success-msg { color: #4dff4d; text-align: center; margin-bottom: 10px; display: none; }
  </style>
</head>
<body>
  <header class="band gut">
    <div class="in head">
      <div class="brand">
        <img class="logo" src="/logo.png" alt="Exam Warriors logo">
        <div>
          <span class="wm">Exam Warriors</span>
        </div>
      </div>
      <nav>
        <a href="/">Back to Site</a>
      </nav>
    </div>
  </header>

  <main class="gut">
    <div class="auth-container">
      <h2 id="form-title">Login</h2>
      
      <div id="error-box" class="error-msg"></div>
      <div id="success-box" class="success-msg"></div>

      <form id="auth-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="auth-btn" id="submit-btn">Log In</button>
      </form>

      <div class="toggle-text">
        <span id="toggle-msg">Don't have an account?</span> 
        <a id="toggle-link">Register here</a>
      </div>
    </div>
  </main>

  <script>
    let isLoginMode = true;
    const form = document.getElementById('auth-form');
    const title = document.getElementById('form-title');
    const submitBtn = document.getElementById('submit-btn');
    const toggleLink = document.getElementById('toggle-link');
    const toggleMsg = document.getElementById('toggle-msg');
    const errorBox = document.getElementById('error-box');
    const successBox = document.getElementById('success-box');

    // Switch between Login and Register modes
    toggleLink.addEventListener('click', (e) => {
      e.preventDefault();
      isLoginMode = !isLoginMode;
      errorBox.style.display = 'none';
      successBox.style.display = 'none';
      form.reset();

      if (isLoginMode) {
        title.textContent = 'Login';
        submitBtn.textContent = 'Log In';
        toggleMsg.textContent = "Don't have an account?";
        toggleLink.textContent = 'Register here';
      } else {
        title.textContent = 'Create an Account';
        submitBtn.textContent = 'Register';
        toggleMsg.textContent = "Already have an account?";
        toggleLink.textContent = 'Login here';
      }
    });

    // Handle Form Submission
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      successBox.style.display = 'none';

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const endpoint = isLoginMode ? '/api/login' : '/api/register';

      try {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Please wait...';

        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Something went wrong');
        }

        // Success!
        successBox.textContent = data.message;
        successBox.style.display = 'block';
        
        if (isLoginMode) {
          // Save user to local storage so the site knows they are logged in
          localStorage.setItem('examWarriorUser', JSON.stringify(data.user));
          setTimeout(() => { window.location.href = '/'; }, 1500); // Redirect to home
        } else {
          // If they just registered, switch them to login mode
          setTimeout(() => { toggleLink.click(); }, 1500);
        }

      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = isLoginMode ? 'Log In' : 'Register';
      }
    });
  </script>
</body>
</html>
